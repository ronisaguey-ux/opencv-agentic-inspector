<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b7ba8"/>
    </marker>
    <style>
      .box{fill:#eef4fb;stroke:#2f5b96;stroke-width:1.6;rx:10}
      .cloud{fill:#f3ecfb;stroke:#6b3fa0;stroke-width:1.6;rx:10}
      .edge{fill:#fdf3e7;stroke:#b06a1f;stroke-width:1.6;rx:10}
      .lbl{font-size:14px;font-weight:700;fill:#123}
      .sm{font-size:11.5px;fill:#456}
      .ttl{font-size:13px;font-weight:800;fill:#2f5b96;letter-spacing:.06em}
      .ttl2{font-size:13px;font-weight:800;fill:#6b3fa0;letter-spacing:.06em}
      .ttl3{font-size:13px;font-weight:800;fill:#b06a1f;letter-spacing:.06em}
      .flow{stroke:#5b7ba8;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .zone{fill:none;stroke:#c8d4e6;stroke-width:1.4;stroke-dasharray:6 5;rx:14}
    </style>
  </defs>

  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="34" y="40" class="lbl" font-size="19">Agentic Visual Inspector — architecture</text>
  <text x="34" y="62" class="sm">Perception runs on the edge (OpenCV 5, CPU, no cloud). The agent's reasoning is the AWS cloud half. COOL/Graviton path is optional and marked.</text>

  <!-- edge zone -->
  <rect class="zone" x="24" y="86" width="330" height="470"/>
  <text x="40" y="112" class="ttl3">EDGE / LINE</text>

  <rect class="edge" x="44" y="128" width="290" height="64"/>
  <text x="60" y="152" class="lbl">Camera / line frame</text>
  <text x="60" y="174" class="sm">RGB frame at the QA station</text>

  <rect class="edge" x="44" y="212" width="290" height="92"/>
  <text x="60" y="236" class="lbl">OpenCV 5 · dnn</text>
  <text x="60" y="256" class="sm">blobFromImage → net.forward()</text>
  <text x="60" y="274" class="sm">YOLOv10 ONNX · NMS-free · CPU</text>
  <text x="60" y="292" class="sm">~110–200 ms / frame</text>

  <rect class="edge" x="44" y="324" width="290" height="80"/>
  <text x="60" y="348" class="lbl">Detection + render</text>
  <text x="60" y="368" class="sm">class, confidence, bbox, area</text>
  <text x="60" y="386" class="sm">overlay drawn for the operator</text>

  <rect class="edge" x="44" y="424" width="290" height="110"/>
  <text x="60" y="448" class="lbl">Line history (memory)</text>
  <text x="60" y="468" class="sm">recent defects per station</text>
  <text x="60" y="486" class="sm">similar() ranks class then recency</text>
  <text x="60" y="504" class="sm">stats() = counts per class / window</text>
  <text x="60" y="522" class="sm">SQLite — survives a restart</text>

  <!-- cloud zone -->
  <rect class="zone" x="396" y="86" width="330" height="470"/>
  <text x="412" y="112" class="ttl2">AWS CLOUD</text>

  <rect class="cloud" x="416" y="212" width="290" height="150"/>
  <text x="432" y="238" class="lbl">Reasoning agent</text>
  <text x="432" y="258" class="sm">bounded tool loop (≤2 calls)</text>
  <text x="432" y="276" class="sm">system contract → strict JSON</text>
  <text x="432" y="294" class="sm">investigates, matches priors,</text>
  <text x="432" y="312" class="sm">judges trend, recommends action</text>
  <text x="432" y="334" class="sm">AWS Bedrock Converse (or local)</text>
  <text x="432" y="352" class="sm">never invents history it wasn't given</text>

  <rect class="cloud" x="416" y="392" width="290" height="70"/>
  <text x="432" y="416" class="lbl">Bedrock — model inference</text>
  <text x="432" y="436" class="sm">Converse API · tool use · region-scoped</text>

  <rect class="cloud" x="416" y="128" width="290" height="64"/>
  <text x="432" y="152" class="lbl">Decision record</text>
  <text x="432" y="174" class="sm">severity, pattern, action, trace</text>

  <!-- ops zone -->
  <rect class="zone" x="768" y="86" width="328" height="470"/>
  <text x="784" y="112" class="ttl">OPERATOR / REVIEW</text>

  <rect class="box" x="788" y="212" width="288" height="90"/>
  <text x="804" y="236" class="lbl">Decision dashboard</text>
  <text x="804" y="256" class="sm">severity badge · recommended action</text>
  <text x="804" y="274" class="sm">readable reasoning trace</text>
  <text x="804" y="292" class="sm">annotated frame</text>

  <rect class="box" x="788" y="324" width="288" height="80"/>
  <text x="804" y="348" class="lbl">Supervisor</text>
  <text x="804" y="368" class="sm">can read AND challenge the decision</text>
  <text x="804" y="386" class="sm">human control stays in the loop</text>

  <rect class="box" x="788" y="424" width="288" height="70"/>
  <text x="804" y="448" class="lbl">Alert / escalation</text>
  <text x="804" y="468" class="sm">critical=true → halt &amp; inspect</text>

  <!-- flows -->
  <path class="flow" d="M334,160 L416,160"/>
  <path class="flow" d="M334,246 L416,246"/>
  <path class="flow" d="M334,470 L416,300"/>
  <path class="flow" d="M706,300 L788,258"/>
  <path class="flow" d="M706,160 L788,212"/>
  <path class="flow" d="M706,427 L788,452"/>
  <path class="flow" d="M561,362 L561,392"/>

  <!-- optional COOL / Graviton -->
  <rect x="44" y="552" width="1016" height="52" fill="#fff7e8" stroke="#b06a1f" stroke-width="1.2" rx="9"/>
  <text x="60" y="574" class="sm" font-size="11"><tspan font-weight="800" fill="#b06a1f">Optional graded path:</tspan>
    COOL (Cloud-Optimized OpenCV) on AWS Graviton — the same perception calls execute on the Arm path.</text>
  <text x="60" y="592" class="sm" font-size="11">The CPU-perception core above is host-agnostic, so this is a deploy target, not a rewrite.</text>
</svg>
